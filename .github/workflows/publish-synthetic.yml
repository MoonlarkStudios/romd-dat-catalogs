name: Publish catalogs

on:
  workflow_call:
    inputs:
      tooling_ref:
        description: Full commit of the tooling checkout; match the caller's uses pin
        required: true
        type: string
      bootstrap:
        description: New independent deployment only; never resets an existing site
        type: boolean
        default: false
      migration_site:
        description: Existing signed site to restore for the first data-repo deployment only
        type: string
        default: ''
    secrets:
      TUF_ONLINE_KEYS:
        required: true

concurrency:
  group: dat-catalog-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository != 'MoonlarkStudios/romd-dat-catalogs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Validate tooling pin
        env:
          TOOLING_REF: ${{ inputs.tooling_ref }}
        run: '[[ "$TOOLING_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MoonlarkStudios/romd-dat-catalogs
          ref: ${{ inputs.tooling_ref }}
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: '2026.8.8'
          cache: false
      - run: mise run check
      - run: ./bin/distribution validate-definitions --definitions definitions
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Restore authenticated prior state
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          MIGRATION_SITE: ${{ inputs.migration_site }}
        run: |
          ./bin/distribution restore --site "$SITE" --root trust/1.root.json --state output --bootstrap="$BOOTSTRAP" --migration-site "$MIGRATION_SITE"
      - name: Publish synthetic local candidate
        run: ./bin/publisher --output output fixtures/manifest.json
      - name: Acquire enabled catalogs with shared provider pacing
        env:
          SATURN_ENABLED: ${{ vars.REDUMP_SATURN_PUBLISH_ENABLED }}
          SEGACD_ENABLED: ${{ vars.REDUMP_SEGACD_PUBLISH_ENABLED }}
          DC_ENABLED: ${{ vars.REDUMP_DC_PUBLISH_ENABLED }}
          PSX_ENABLED: ${{ vars.REDUMP_PSX_PUBLISH_ENABLED }}
          SNES_ENABLED: ${{ vars.NOINTRO_SNES_PUBLISH_ENABLED }}
          GB_ENABLED: ${{ vars.NOINTRO_GB_PUBLISH_ENABLED }}
          GBC_ENABLED: ${{ vars.NOINTRO_GBC_PUBLISH_ENABLED }}
          GBA_ENABLED: ${{ vars.NOINTRO_GBA_PUBLISH_ENABLED }}
          GENESIS_ENABLED: ${{ vars.NOINTRO_GENESIS_PUBLISH_ENABLED }}
          N64_ENABLED: ${{ vars.NOINTRO_N64_PUBLISH_ENABLED }}
          NES_ENABLED: ${{ vars.NOINTRO_NES_PUBLISH_ENABLED }}
          SMS_ENABLED: ${{ vars.NOINTRO_SMS_PUBLISH_ENABLED }}
          GG_ENABLED: ${{ vars.NOINTRO_GG_PUBLISH_ENABLED }}
          TG16_ENABLED: ${{ vars.NOINTRO_TG16_PUBLISH_ENABLED }}
          SEGA32X_ENABLED: ${{ vars.NOINTRO_32X_PUBLISH_ENABLED }}
        run: |
          set -euo pipefail
          args=(--output output --definitions definitions)
          select_catalog() {
            if [ "$2" = true ]; then
              args+=(--catalog "$1")
            else
              args+=(--pause-catalog "$1")
            fi
          }
          select_catalog redump/psx/discs "$PSX_ENABLED"
          select_catalog redump/saturn/discs "$SATURN_ENABLED"
          select_catalog redump/segacd/discs "$SEGACD_ENABLED"
          select_catalog redump/dc/discs "$DC_ENABLED"
          select_catalog no-intro/snes/standard "$SNES_ENABLED"
          select_catalog no-intro/gb/standard "$GB_ENABLED"
          select_catalog no-intro/gbc/standard "$GBC_ENABLED"
          select_catalog no-intro/gba/standard "$GBA_ENABLED"
          select_catalog no-intro/genesis/standard "$GENESIS_ENABLED"
          select_catalog no-intro/n64/standard "$N64_ENABLED"
          select_catalog no-intro/nes/standard "$NES_ENABLED"
          select_catalog no-intro/sms/standard "$SMS_ENABLED"
          select_catalog no-intro/gg/standard "$GG_ENABLED"
          select_catalog no-intro/tg16/standard "$TG16_ENABLED"
          select_catalog no-intro/32x/standard "$SEGA32X_ENABLED"
          ./bin/publisher "${args[@]}" > publication-summary.json
          {
            printf '### Catalog acquisition result\n\n```json\n'
            cat publication-summary.json
            printf '\n```\n\nFailures preserve the last working artifact. New mirrors require recorded qualification.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check out data repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: data
          fetch-depth: 0
      - name: Commit changed documents
        id: data
        run: |
          set -euo pipefail
          ./bin/distribution export-data --state output --out data
          git -C data config user.name 'ROMD catalog publisher'
          git -C data config user.email 'catalog-publisher@users.noreply.github.com'
          git -C data -c core.autocrlf=false add -- '*.dat'
          if ! git -C data diff --cached --quiet; then
            git -C data commit -m 'chore(data): update complete catalogs'
            git -C data push
          fi
          printf 'commit=%s\n' "$(git -C data rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git -C data count-objects -vH >> "$GITHUB_STEP_SUMMARY"
      - name: Stage and sign
        id: stage
        env:
          TUF_ONLINE_KEYS: ${{ secrets.TUF_ONLINE_KEYS }}
          DATA_REPOSITORY: ${{ github.repository }}
          DATA_COMMIT: ${{ steps.data.outputs.commit }}
        run: |
          set -euo pipefail
          test -n "$TUF_ONLINE_KEYS"
          previous=0
          if [ -f output/.distribution-version ]; then
            previous=$(cat output/.distribution-version)
          fi
          version=$((previous + 1))
          test "$version" -gt "$previous"
          keyfile="$RUNNER_TEMP/tuf-online.json"
          umask 077
          printf '%s' "$TUF_ONLINE_KEYS" > "$keyfile"
          trap 'rm -f "$keyfile"' EXIT
          ./bin/distribution stage --keys "$keyfile" --trust trust --state output --out staged --version "$version" --data-repository "$DATA_REPOSITORY" --data-commit "$DATA_COMMIT" --definitions definitions
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Verify public asset availability and hashes
        run: ./bin/distribution verify-assets --index staged/index.json
      - name: Upload verified Pages deployment
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: staged/site
          retention-days: 1
      - name: Advance public metadata and RSS
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify deployed signature chain and restore
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if ./bin/distribution restore --site "$SITE" --root trust/1.root.json --cache .verification-cache --state verified-output --expected-version "$VERSION"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          exit 1
